packages:
  - 'apps/*'
  - 'packages/*'
nodeLinker: hoisted
verifyDepsBeforeRun: false
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - 'prisma'
  - 'esbuild'
  - 'argon2'
  - '@parcel/watcher'
  - 'unrs-resolver'
allowBuilds:
  'msgpackr-extract': false
  '@prisma/client': true
  '@prisma/engines': true
  'prisma': true
  'esbuild': true
  'argon2': true
  '@parcel/watcher': true
  'unrs-resolver': true

