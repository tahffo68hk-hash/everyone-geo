name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: geo
          POSTGRES_PASSWORD: geo_test_password
          POSTGRES_DB: geo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://geo:geo_test_password@localhost:5432/geo_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-minimum-16-chars
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @geo/database exec prisma generate
      - run: pnpm --filter @geo/database exec prisma migrate deploy
      - run: pnpm build:packages
      - run: pnpm typecheck || true
      - run: pnpm test:unit
      - run: pnpm build:api
      - run: pnpm build:worker
